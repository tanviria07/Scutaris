# Local Elasticsearch for development when Elastic Cloud is not available.
#   docker compose up -d
# Then in .env:  ELASTIC_URL=http://localhost:9200  (leave ELASTIC_CLOUD_ID blank)

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: scutaris-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.license.self_generated.type=basic
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - scutaris-es-data:/usr/share/elasticsearch/data

volumes:
  scutaris-es-data:
